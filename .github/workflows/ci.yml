name: RouteDev CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '11.7.0'
  HUSKY: '0'  # husky v9 在 CI 无需安装 git hooks（prepare 阶段直接退出）

jobs:
  core:
    name: Core typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routedev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: routedev/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Print pnpm diagnostics
        if: failure()
        run: |
          node --version
          pnpm --version
          pnpm config list
          curl -sI https://registry.npmjs.org/ --max-time 10 | head -1
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: routedev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: routedev/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm typecheck:desktop
      - run: pnpm test:desktop
      - run: pnpm build:electron

  android:
    name: Android unit, lint and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routedev-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew && ./gradlew --no-daemon test lint assembleDebug --stacktrace

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routedev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: routedev/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm audit --prod --audit-level=high
      - name: Reject obvious committed private keys
        working-directory: .
        run: |
          if git -C .. grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}' -- routedev routedev-android; then
            echo 'Potential secret detected in tracked files.'
            exit 1
          fi
