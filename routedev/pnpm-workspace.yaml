# pnpm 11+ 工作区配置
# 允许 esbuild 运行构建脚本（vitest/tsup 依赖 esbuild 的原生二进制）
allowBuilds:
  electron: true
  esbuild: true
  # 构建脚本显式决策（2026-08-06 复审：ERR_PNPM_IGNORED_BUILDS 修复）
  # sharp：@xenova/transformers 本地嵌入的原生绑定，需要 install 脚本 → true
  sharp: true
  # puppeteer：browser 工具需要下载 Chromium，需要 install 脚本 → true
  puppeteer: true
  # protobufjs：onnx-proto 可选链的 pbjs 包装生成（主功能不需要）→ false
  protobufjs: false
# pnpm 11+ 项目设置（原 .npmrc 的 enable-pre-post-scripts/save-exact/min-release-age 迁移至此）
saveExact: true
enablePrePostScripts: true
minimumReleaseAge: 2880

# 供应链漏洞修复 overrides（2026-08-06 audit：pnpm 11 设置统一在 workspace yaml）
# protobufjs：onnx 链 6.11.6 多个 critical/high（GHSA-xq3m-2v4x-88gg 等，修复 >=7.6.1）
# js-yaml：electron-updater 依赖 4.2.0（修复 >=4.3.0）
# fast-uri：MCP SDK>ajv 依赖 3.1.2（修复 >=3.1.5）
# sharp：@xenova/transformers 依赖 0.32.6（修复 >=0.35.0）
# ip-address：MCP SDK>express-rate-limit 依赖 10.2.0（修复 >=10.3.1）
overrides:
  protobufjs: ^7.6.1
  js-yaml: ^4.3.0
  fast-uri: ^3.1.5
  sharp: ^0.35.0
  ip-address: ^10.3.1
