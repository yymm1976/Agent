appId: com.routedev.app
productName: RouteDev
copyright: Copyright © 2026
asar: true
asarUnpack:
  - node_modules/tiktoken/**/*
directories:
  output: release-v25
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
# 将托盘图标打包到 resources 目录，供主进程在运行时通过 process.resourcesPath 访问
extraResources:
  - from: build/icon.png
    to: icon.png
    filter: ['**/*']
extraMetadata:
  main: out/main/index.js
  routedevSignedRelease: false
  routedevTrustedUpdateSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - dmg
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png



